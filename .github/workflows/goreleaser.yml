---
# SLSA Level 3 Release Workflow
# This workflow ensures every release artifact is accompanied by SLSA Level 3 provenance,
# uses commit hashes for security, includes comprehensive logging, and provides 
# cryptographic assurance for users.

name: "SLSA Level 3 Enhanced Release"

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: read

env:
  REGISTRY: ghcr.io
  CORE_CHART_PATH: ./core-chart
  GO_VERSION: "1.24"

jobs:
  # SLSA Level 3: Security validation job (NEW)
  security-validation:
    name: "Security Validation"
    runs-on: ubuntu-latest
    outputs:
      commit-hash: ${{ steps.commit.outputs.hash }}
      build-timestamp: ${{ steps.timestamp.outputs.value }}
    steps:
      - name: "Checkout with full history"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: "Set up Go"
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: "Log build information"
        id: commit
        run: |
          echo "=== SLSA Level 3 Build Starting ==="
          echo "Repository: ${{ github.repository }}"
          echo "Commit: ${{ github.sha }}"
          echo "Tag: ${{ github.ref_name }}"
          echo "hash=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: "Set build timestamp"
        id: timestamp
        run: |
          timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "Build timestamp: $timestamp"
          echo "value=$timestamp" >> "$GITHUB_OUTPUT"

      - name: "Verify dependencies"
        run: |
          echo "=== Dependency Verification ==="
          go mod verify
          go mod tidy

      - name: "Run vulnerability scan"
        run: |
          echo "=== Security Vulnerability Scan ==="
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  # Enhanced original goreleaser job with SLSA Level 3 features
  goreleaser:
    name: "Build and Release"
    needs: security-validation  # SLSA Level 3: Depends on security validation
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.binary.outputs.hashes }}
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.image.outputs.digest }}
    permissions:
      contents: write
      packages: write
      id-token: write  # SLSA Level 3: Required for provenance

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          # SLSA Level 3: Use commit hash from security validation
          ref: ${{ needs.security-validation.outputs.commit-hash }}

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Delete non-semver tags
        run: 'git tag -d $(git tag -l | grep -v "^v")'

      - name: Set LDFLAGS
        run: echo LDFLAGS="$(make ldflags)" >> $GITHUB_ENV

      - name: Install syft binary executable
        uses: anchore/sbom-action/download-syft@9246b90769f852b3a8921f330c59e0b3f439d6e9

      # SLSA Level 3: Enhanced pre-build logging
      - name: "SLSA Level 3 Pre-build logging"
        run: |
          echo "=== SLSA Level 3 Build Information ==="
          echo "Commit Hash: ${{ needs.security-validation.outputs.commit-hash }}"
          echo "Build Timestamp: ${{ needs.security-validation.outputs.build-timestamp }}"
          echo "Go Version: $(go version)"

      - name: Run GoReleaser on tag
        id: goreleaser  # SLSA Level 3: Added ID for outputs
        uses: goreleaser/goreleaser-action@9c156ee8a17a598857849441385a2041ef570552
        with:
          distribution: goreleaser
          version: latest
          args: release --timeout 60m --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USER: ${{ github.actor }}
          EMAIL: ${{ github.actor}}@users.noreply.github.com
          # SLSA Level 3: Enhanced LDFLAGS with commit hash
          LDFLAGS: >-
            ${{ env.LDFLAGS }}
            -X main.commit=${{ needs.security-validation.outputs.commit-hash }}
            -X main.date=${{ needs.security-validation.outputs.build-timestamp }}

      # SLSA Level 3: Generate binary hashes for provenance (NEW)
      - name: "Generate binary hashes for SLSA provenance"
        id: binary
        env:
          ARTIFACTS: "${{ steps.goreleaser.outputs.artifacts }}"
        run: |
          echo "=== Generating Binary Hashes ==="
          set -euo pipefail
          checksum_file=$(echo "$ARTIFACTS" | jq -r '.[] | select (.type=="Checksum") | .path')
          if [[ -f "$checksum_file" ]]; then
            hashes=$(cat "$checksum_file" | base64 -w0)
            echo "hashes=$hashes" >> "$GITHUB_OUTPUT"
            echo "Binary hashes generated successfully"
          else
            echo "Error: Checksum file not found"
            exit 1
          fi

      # SLSA Level 3: Extract container image information (NEW)
      - name: "Extract container image information"
        id: image
        env:
          ARTIFACTS: "${{ steps.goreleaser.outputs.artifacts }}"
        run: |
          echo "=== Extracting Container Information ==="
          set -euo pipefail
          image_and_digest=$(echo "$ARTIFACTS" | jq -r '.[] | select (.type=="Docker Manifest") | .path' | head -1)
          if [[ -n "$image_and_digest" ]]; then
            image=$(echo "${image_and_digest}" | cut -d'@' -f1 | cut -d':' -f1)
            digest=$(echo "${image_and_digest}" | cut -d'@' -f2)
            echo "name=$image" >> "$GITHUB_OUTPUT"
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
            echo "Extracted image: $image"
          else
            echo "Warning: No container manifest found"
          fi

      - name: Set up Helm
        uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package and push charts
        run: |
          chartVersion=$(echo ${{ github.ref_name }} | cut -c 2-)
          sed -i "s/^KUBESTELLAR_VERSION:.*$/KUBESTELLAR_VERSION: \"${chartVersion}\"/g" ${{ env.CORE_CHART_PATH }}/values.yaml
          helm package ${{ env.CORE_CHART_PATH }} --destination . --version ${chartVersion} --app-version ${chartVersion} --dependency-update
          helm push ./core-chart*.tgz oci://${{ env.REGISTRY }}/kubestellar/kubestellar

      # SLSA Level 3: Enhanced logging for chart operations
      - name: "SLSA Level 3 Post-build verification"
        run: |
          echo "=== SLSA Level 3 Post-Build Verification ==="
          echo "Charts packaged and pushed successfully"
          echo "All artifacts created with commit hash: ${{ needs.security-validation.outputs.commit-hash }}"

  # SLSA Level 3: Binary provenance generation (NEW)
  binary-provenance:
    name: "Generate Binary Provenance"
    needs: [security-validation, goreleaser]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.0.0
    with:
      base64-subjects: "${{ needs.goreleaser.outputs.hashes }}"
      upload-assets: true

  # SLSA Level 3: Container provenance generation (NEW)
  image-provenance:
    name: "Generate Container Provenance"
    needs: [security-validation, goreleaser]
    if: needs.goreleaser.outputs.image != ''
    permissions:
      actions: read
      id-token: write
      packages: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.0.0
    with:
      image: ${{ needs.goreleaser.outputs.image }}
      digest: ${{ needs.goreleaser.outputs.digest }}
      registry-username: ${{ github.actor }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}

  # SLSA Level 3: Verification with SLSA verifier (NEW)
  verification-with-slsa-verifier:
    name: "Verify SLSA Provenance"
    needs: [security-validation, goreleaser, binary-provenance]
    runs-on: ubuntu-latest
    permissions: read-all
    steps:
      - name: "Install SLSA verifier"
        uses: slsa-framework/slsa-verifier/actions/installer@v2.5.1

      - name: "Download release assets"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROVENANCE: "${{ needs.binary-provenance.outputs.provenance-name }}"
        run: |
          echo "=== Downloading Release Assets ==="
          gh -R "$GITHUB_REPOSITORY" release download "$GITHUB_REF_NAME" -p "*.tar.gz"
          gh -R "$GITHUB_REPOSITORY" release download "$GITHUB_REF_NAME" -p "*.zip"
          gh -R "$GITHUB_REPOSITORY" release download "$GITHUB_REF_NAME" -p "$PROVENANCE"

      - name: "Verify binary artifacts"
        env:
          CHECKSUMS: ${{ needs.goreleaser.outputs.hashes }}
          PROVENANCE: "${{ needs.binary-provenance.outputs.provenance-name }}"
        run: |
          echo "=== Verifying Binary Artifacts ==="
          set -euo pipefail
          checksums=$(echo "$CHECKSUMS" | base64 -d)
          while read -r line; do
              if [[ -n "$line" ]]; then
                  fn=$(echo $line | cut -d ' ' -f2)
                  echo "Verifying artifact: $fn"
                  if [[ -f "$fn" ]]; then
                    slsa-verifier verify-artifact \
                      --provenance-path "$PROVENANCE" \
                      --source-uri "github.com/$GITHUB_REPOSITORY" \
                      --source-tag "$GITHUB_REF_NAME" \
                      "$fn"
                    echo "✅ Verification successful for $fn"
                  fi
              fi
          done <<<"$checksums"

  # SLSA Level 3: Container verification with Cosign (NEW)
  verification-with-cosign:
    name: "Verify Container Images"
    needs: [security-validation, goreleaser, image-provenance]
    if: needs.goreleaser.outputs.image != ''
    runs-on: ubuntu-latest
    permissions: read-all
    steps:
      - name: "Container registry login"
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Install Cosign"
        uses: sigstore/cosign-installer@59acb6260d9c0ba8f4a2f9d9b48431a222b68e20

      - name: "Verify container image attestations"
        env:
          IMAGE: ${{ needs.goreleaser.outputs.image }}
          DIGEST: ${{ needs.goreleaser.outputs.digest }}
        run: |
          echo "=== Verifying Container Image Attestations ==="
          if [[ -n "$IMAGE" && -n "$DIGEST" ]]; then
            cosign verify-attestation \
              --type slsaprovenance \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity-regexp '^https://github.com/slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@refs/tags/v[0-9]+.[0-9]+.[0-9]+$' \
              "$IMAGE@$DIGEST"
            echo "✅ Container image verification successful"
          fi

  # SLSA Level 3: Release summary (NEW)
  release-summary:
    name: "Release Summary"
    needs: [security-validation, goreleaser, binary-provenance, image-provenance, verification-with-slsa-verifier, verification-with-cosign]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: "Generate release summary"
        run: |
          echo "# 🚀 SLSA Level 3 Enhanced KubeStellar Release" >> $GITHUB_STEP_SUMMARY
          echo "## Release Information" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ needs.security-validation.outputs.commit-hash }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Time**: ${{ needs.security-validation.outputs.build-timestamp }}" >> $GITHUB_STEP_SUMMARY
          echo "## Components Released" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Binary artifacts (controller-manager, ocm-transport-controller)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Container images with SLSA Level 3 provenance" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Helm charts packaged and pushed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ SBOM (Software Bill of Materials) generated" >> $GITHUB_STEP_SUMMARY
          echo "## Security Compliance ✅" >> $GITHUB_STEP_SUMMARY
          echo "- SLSA Build Level 3 compliant" >> $GITHUB_STEP_SUMMARY
          echo "- Cryptographic signing with Sigstore" >> $GITHUB_STEP_SUMMARY
          echo "- Vulnerability scanning completed" >> $GITHUB_STEP_SUMMARY
          echo "- Commit hash immutability enforced" >> $GITHUB_STEP_SUMMARY
          echo "=== Release Process Completed ===" >> $GITHUB_STEP_SUMMARY
              
              